<!DOCTYPE html>
<html lang="es" class="no-scroll">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title data-i18n="app.title_full">Registro de Transacciones PWA — Firefly III</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Firefly Ledger" data-i18n="apple.title">
    <meta name="format-detection" content="telephone=no">

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- jQuery -->
    <script src="js/jquery-3.6.0.min.js"></script>

</head>
<body>

    <!-- Loading indicator: visible until app boots -->
    <div id="loading-screen" class="fixed inset-0 bg-ios-bg flex flex-col items-center justify-center z-[9999]">
        <div class="spinner spinner-lg"></div>
        <p class="mt-4 text-[15px] text-ios-text-secondary font-medium" data-i18n="loading.message">Cargando...</p>
    </div>

    <!-- Mount point: screens get injected here -->
    <div id="app"></div>

    <!-- ============================================================ -->
    <!-- SCREEN TEMPLATES -->
    <!-- ============================================================ -->

    <!-- ── Configuración (URL + Token) ── -->
    <template id="screen-setup">
        <div id="setup-container" class="screen screen-stack hidden">
            <div class="flex-1 overflow-y-auto px-4 pt-16 pb-4 ios-scroll">
                <div class="text-center mb-10">
                    <div class="w-16 h-16 bg-ios-blue-bg rounded-2xl flex items-center justify-center mx-auto mb-4">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#5856D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                    </div>
                    <h1 class="text-[28px] font-bold text-ios-text tracking-[-0.5px]" data-i18n="setup.title">Configuración</h1>
                    <p class="text-ios-text-secondary text-[15px] mt-2 max-w-xs mx-auto leading-5" data-i18n="setup.subtitle">
                        Conecta tu instancia de Firefly III con tu Token de Acceso Personal para empezar.
                    </p>
                </div>
                <form id="config-form">
                    <p class="section-label" data-i18n="setup.section_connection">Conexión</p>
                    <div class="field-card mb-6">
                        <div class="field-row">
                            <span class="field-label field-label--tight" data-i18n="setup.url_label">URL</span>
                            <div class="field-value">
                                <input type="url" id="firefly-url" required placeholder="https://miapp.firefly-iii.org"
                                       class="ios-input"
                                       data-i18n-placeholder="setup.url_placeholder">
                            </div>
                        </div>
                        <div class="field-row">
                            <span class="field-label field-label--tight" data-i18n="setup.token_label">Token</span>
                            <div class="field-value">
                                <input type="password" id="personal-token" required placeholder="xxxxxxxxxxxxxxxxxxxxxxx"
                                       class="ios-input"
                                       data-i18n-placeholder="setup.token_placeholder">
                            </div>
                        </div>
                    </div>
                    <div id="config-message" class="ios-status hidden"></div>
                </form>
            </div>
            <footer class="sticky-footer">
                <button type="submit" id="setup-submit-btn" class="ios-btn-primary" form="config-form">
                    <span data-i18n="setup.submit_btn">Conectar y Continuar</span>
                </button>
            </footer>
        </div>
    </template>

    <!-- ── Selección de Cuenta Default ── -->
    <template id="screen-account-picker">
        <div id="default-account-container" class="screen screen-stack hidden">
            <div class="flex-1 overflow-y-auto px-4 pt-16 pb-4 ios-scroll">
                <div class="text-center mb-10">
                    <div class="w-16 h-16 bg-ios-blue-bg rounded-2xl flex items-center justify-center mx-auto mb-4">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#5856D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="5" width="20" height="14" rx="2"/>
                            <line x1="2" y1="10" x2="22" y2="10"/>
                        </svg>
                    </div>
                    <h1 class="text-[28px] font-bold text-ios-text tracking-[-0.5px]" data-i18n="account.title">Cuenta Default</h1>
                    <p class="text-ios-text-secondary text-[15px] mt-2 max-w-xs mx-auto leading-5" data-i18n="account.subtitle">
                        Selecciona la cuenta que se usará por defecto como origen al registrar tus transacciones.
                    </p>
                </div>
                <p class="section-label" data-i18n="account.section">Cuenta Origen</p>
                <div class="field-card mb-6">
                    <div class="field-row">
                        <span class="field-label field-label--tight" data-i18n="account.select_label">Cuenta</span>
                        <div class="field-value">
                            <select id="default-account-select" class="ios-select">
                                <option value="" data-i18n="account.loading">Cargando cuentas...</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div id="default-account-message" class="ios-status hidden"></div>
            </div>
            <footer class="sticky-footer">
                <button id="save-default-account-btn" class="ios-btn-primary">
                    <span data-i18n="account.save_btn">Guardar y Continuar</span>
                </button>
            </footer>
        </div>
    </template>

    <!-- ── Dashboard / Registro de Transacciones ── -->
    <template id="screen-record">
        <div id="dashboard-container" class="screen screen-stack hidden">
            <header class="nav-bar">
                <h1 class="text-[22px] font-bold text-ios-text tracking-[-0.5px]" data-i18n="app.title">Registro</h1>
                <div class="flex items-center gap-4">
                    <button class="theme-toggle" onclick="FFPWA.theme.cycle()" title="Cambiar tema"><span class="theme-icon">🌙</span></button>
                    <button class="lang-btn text-sm font-semibold text-ios-blue">EN</button>
                    <button id="config-btn" class="text-sm font-semibold text-ios-blue" data-i18n="nav.config">Config</button>
                    <span class="online-status text-xs font-semibold text-ios-green bg-ios-green-bg px-3 py-1 rounded-full">● Online</span>
                </div>
            </header>
            <main class="flex-1 overflow-y-auto px-4 pt-3 pb-4 ios-scroll">
                <div class="mb-6">
                    <p class="section-label" data-i18n="transaction.type">Tipo de Transacción</p>
                    <div class="segmented-control" role="radiogroup" id="type-selector">
                        <button type="button" role="radio" aria-checked="true" data-type="withdrawal" class="segmented-btn active">💸 <span data-i18n="transaction.withdrawal">Gasto</span></button>
                        <button type="button" role="radio" aria-checked="false" data-type="deposit" class="segmented-btn">💰 <span data-i18n="transaction.deposit">Depósito</span></button>
                        <button type="button" role="radio" aria-checked="false" data-type="transfer" class="segmented-btn">🔄 <span data-i18n="transaction.transfer">Transferencia</span></button>
                    </div>
                    <input type="hidden" id="transaction-type" value="withdrawal">
                </div>
                <div id="status-message" class="ios-status hidden"></div>
                <form id="transaction-form">
                    <div class="mb-6 field-group">
                        <p class="section-label" data-i18n="transaction.source_section">Cuenta Origen</p>
                        <div class="field-card">
                            <div class="field-row">
                                <span class="field-label"><span data-i18n="transaction.source_label">Origen</span> <span id="source-type-hint" class="field-hint" data-i18n="transaction.source_hint_asset">(Asset)</span></span>
                                <div class="field-value">
                                    <div class="relative flex-1">
                                        <input type="text" id="source-account" placeholder="Selecciona..." autocomplete="off" class="ios-input" data-i18n-placeholder="transaction.source_placeholder">
                                        <div id="source-autocomplete" class="autocomplete-dropdown hidden"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <input type="hidden" id="source-account-id" name="source-account-id">
                        <input type="hidden" id="source-account-name" name="source-account-name">
                    </div>
                    <div class="mb-6 field-group">
                        <p class="section-label" data-i18n="transaction.dest_section">Cuenta Destino</p>
                        <div class="field-card">
                            <div class="field-row">
                                <span class="field-label"><span data-i18n="transaction.dest_label">Destino</span> <span id="dest-type-hint" class="field-hint" data-i18n="transaction.dest_hint_expense">(Expense)</span></span>
                                <div class="field-value">
                                    <div class="relative flex-1">
                                        <input type="text" id="destination-account" required placeholder="Buscar cuenta..." autocomplete="off" class="ios-input" data-i18n-placeholder="transaction.dest_placeholder">
                                        <div id="destination-autocomplete" class="autocomplete-dropdown hidden"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <input type="hidden" id="destination-account-id" name="destination-account-id">
                        <input type="hidden" id="destination-account-name" name="destination-account-name">
                    </div>
                    <div class="mb-6 field-group">
                        <p class="section-label" data-i18n="transaction.details_section">Detalles</p>
                        <div class="field-card">
                            <div class="field-row">
                                <span class="field-label" data-i18n="transaction.description_label">Concepto</span>
                                <div class="field-value">
                                    <input type="text" id="description" required placeholder="Ej: Compra en supermercado" class="ios-input" data-i18n-placeholder="transaction.description_placeholder">
                                </div>
                            </div>
                            <div class="field-row">
                                <span class="field-label" data-i18n="transaction.amount_label">Importe</span>
                                <div class="field-value">
                                    <input type="number" step="0.01" min="0" id="amount" required placeholder="0.00" class="ios-input" data-i18n-placeholder="transaction.amount_placeholder">
                                    <span class="currency-wrap">
                                        <select id="currency-select" class="currency-badge"></select>
                                        <span class="currency-chevron">▼</span>
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div id="exchange-rate-info" class="hidden">
                            <p id="exchange-rate-display" class="text-xs text-ios-text-secondary"></p>
                            <p id="amount-converted" class="text-sm font-medium text-ios-blue hidden"></p>
                        </div>
                    </div>
                </form>
            </main>
            <footer class="sticky-footer">
                <button type="submit" id="submit-transaction-btn" class="ios-btn-primary" form="transaction-form">
                    <span data-i18n="transaction.submit_btn">Registrar Transacción</span>
                </button>
            </footer>
        </div>
    </template>

    <!-- ── Consultar Cuentas y Saldos ── -->
    <template id="screen-accounts">
        <div id="accounts-container" class="screen screen-stack hidden">
            <header class="nav-bar">
                <h1 class="text-[22px] font-bold text-ios-text tracking-[-0.5px]" data-i18n="accounts.title">Cuentas</h1>
                <div class="flex items-center gap-4">
                    <button class="theme-toggle" onclick="FFPWA.theme.cycle()" title="Cambiar tema"><span class="theme-icon">🌙</span></button>
                    <button class="lang-btn text-sm font-semibold text-ios-blue">EN</button>
                    <button id="accounts-config-btn" class="text-sm font-semibold text-ios-blue" data-i18n="nav.config">Config</button>
                    <span class="online-status text-xs font-semibold text-ios-green bg-ios-green-bg px-3 py-1 rounded-full">● Online</span>
                </div>
            </header>
            <main class="flex-1 overflow-y-auto px-4 pt-3 pb-4 ios-scroll">
                <!-- Accounts list view -->
                <div id="accounts-loading" class="text-center py-8">
                    <div class="spinner mx-auto mb-2"></div>
                    <p class="text-sm text-ios-text-secondary" data-i18n="accounts.loading">Cargando cuentas...</p>
                </div>
                <div id="accounts-error" class="ios-status error hidden"></div>
                <div id="accounts-list" class="space-y-3"></div>

                <!-- Transaction detail view (hidden by default) -->
                <div id="account-detail" class="hidden">
                    <!-- Back button + account name -->
                    <button id="detail-back-btn" class="text-sm font-semibold text-ios-blue mb-4">
                        <span data-i18n="detail.back">← Cuentas</span>
                    </button>

                    <!-- Account summary -->
                    <div class="field-card mb-6 p-4">
                        <h2 id="detail-account-name" class="text-[17px] font-semibold text-ios-text"></h2>
                        <p id="detail-account-balance" class="text-[22px] font-bold text-ios-text mt-1"></p>
                        <p id="detail-account-role" class="text-[12px] text-ios-text-secondary mt-0.5"></p>
                    </div>

                    <!-- Loading -->
                    <div id="detail-loading" class="text-center py-8 hidden">
                        <div class="spinner mx-auto mb-2"></div>
                        <p class="text-sm text-ios-text-secondary" data-i18n="detail.loading">Cargando transacciones...</p>
                    </div>

                    <!-- Error -->
                    <div id="detail-error" class="ios-status error hidden"></div>

                    <!-- Transaction list -->
                    <div id="detail-list"></div>

                    <!-- Load more button -->
                    <button id="detail-load-more" class="ios-btn-primary mt-4 hidden">
                        <span data-i18n="detail.load_more">Cargar 50 más</span>
                    </button>
                </div>
            </main>
        </div>
    </template>

    <!-- ── (Próximamente) Historial de Transacciones ── -->
    <template id="screen-history">
        <div id="history-container" class="screen screen-stack hidden">
            <header class="nav-bar">
                <h1 class="text-[22px] font-bold text-ios-text tracking-[-0.5px]" data-i18n="nav.history">Historial</h1>
                <div class="flex items-center gap-4">
                    <button class="theme-toggle" onclick="FFPWA.theme.cycle()" title="Cambiar tema"><span class="theme-icon">🌙</span></button>
                    <button class="lang-btn text-sm font-semibold text-ios-blue">EN</button>
                    <span class="online-status text-xs font-semibold text-ios-green bg-ios-green-bg px-3 py-1 rounded-full">● Online</span>
                </div>
            </header>
            <main class="flex-1 overflow-y-auto px-4 pt-3 pb-4">
                <p class="text-ios-text-secondary text-center mt-10" data-i18n="history.placeholder">Próximamente: historial de transacciones</p>
            </main>
        </div>
    </template>

    <!-- Scripts -->
    <script src="js/i18n.js"></script>
    <script src="js/darkmode.js"></script>
    <script src="js/config.js"></script>
    <script src="js/accounts.js"></script>
    <script src="js/currencies.js"></script>
    <script src="js/transactions.js"></script>
    <script src="js/accounts-screen.js"></script>
    <script src="js/app.js"></script>

    <!-- Boot: inject templates, boot app -->
    <script>
        (function() {
            'use strict';

            var loadingEl = document.getElementById('loading-screen');

            function hideLoadingScreen() {
                if (loadingEl) loadingEl.style.display = 'none';
            }

            function showOfflineFallback() {
                hideLoadingScreen();
                var appEl = document.getElementById('app');
                if (appEl) {
                    appEl.innerHTML =
                        '<div style="text-align:center;padding:60px 20px;color:#8e8e93">' +
                        '  <div style="font-size:48px;margin-bottom:16px">📡</div>' +
                        '  <p style="font-size:17px;font-weight:500;color:#1c1c1e;margin-bottom:8px">Sin conexión</p>' +
                        '  <p style="font-size:14px">Conéctate a internet y vuelve a abrir la app.</p>' +
                        '</div>';
                }
            }

            // Esperar a que jQuery esté disponible (máximo 5s)
            function bootWhenReady(callback) {
                if (typeof $ !== 'undefined') {
                    callback();
                    return;
                }
                var attempts = 0;
                var timer = setInterval(function() {
                    attempts++;
                    if (typeof $ !== 'undefined') {
                        clearInterval(timer);
                        callback();
                    } else if (attempts >= 50) {
                        clearInterval(timer);
                        // jQuery nunca cargó (offline sin SW o error CDN)
                        showOfflineFallback();
                    }
                }, 100);
            }

            bootWhenReady(function() {

                var $app = $('#app');

                // Mount screens
                $app.append(document.getElementById('screen-setup').content.cloneNode(true));
                $app.append(document.getElementById('screen-account-picker').content.cloneNode(true));
                $app.append(document.getElementById('screen-record').content.cloneNode(true));

                // Mount tab bar
                $app.append(
                    '<div id="tab-bar" class="hidden">' +
                        '<button class="tab-btn active" data-screen="record">' +
                            '<span class="tab-icon">📝</span>' +
                            '<span class="tab-label" data-i18n="nav.record">Registro</span>' +
                        '</button>' +
                        '<button class="tab-btn" data-screen="accounts">' +
                            '<span class="tab-icon">💰</span>' +
                            '<span class="tab-label" data-i18n="nav.accounts">Cuentas</span>' +
                        '</button>' +
                    '</div>'
                );

                // Actualizar íconos del theme toggle
                if (window.FFPWA && window.FFPWA.theme) {
                    var mode = window.FFPWA.theme.getCurrent();
                    var btns = document.querySelectorAll('.theme-toggle .theme-icon');
                    btns.forEach(function(icon) {
                        icon.textContent = mode === 'dark' ? '☀️' : '🌙';
                    });
                }

                // Mount utility
                window.mountScreen = function(templateId) {
                    var tpl = document.getElementById(templateId);
                    if (!tpl) return;
                    var content = tpl.content;
                    var firstEl = content.firstElementChild;
                    if (firstEl && firstEl.id && $('#' + firstEl.id).length) return;
                    $app.append(content.cloneNode(true));
                    
                    // Actualizar íconos del theme si hay toggle en el template recién montado
                    if (window.FFPWA && window.FFPWA.theme) {
                        var mode = window.FFPWA.theme.getCurrent();
                        document.querySelectorAll('.theme-toggle .theme-icon').forEach(function(icon) {
                            icon.textContent = mode === 'dark' ? '☀️' : '🌙';
                        });
                    }
                };

                /* ─── Tab switching ─── */
                function switchTab(screen) {
                    $('#setup-container, #default-account-container, #dashboard-container, #accounts-container').addClass('hidden');

                    if (screen === 'record') {
                        $('#dashboard-container').removeClass('hidden');
                    } else if (screen === 'accounts') {
                        window.mountScreen('screen-accounts');
                        $('#accounts-container').removeClass('hidden');
                        if (window.FFPWA.showAccountsScreen) window.FFPWA.showAccountsScreen();
                    }

                    $('#tab-bar .tab-btn').removeClass('active');
                    $('#tab-bar .tab-btn[data-screen="' + screen + '"]').addClass('active');
                    $('#tab-bar').removeClass('hidden');

                    if (!navigator.onLine) {
                        window.FFPWA.updateStatus('offline');
                    }
                    if (window.i18nTranslateDOM) window.i18nTranslateDOM();
                }

                $(document).on('click', '#tab-bar .tab-btn', function() {
                    var screen = $(this).data('screen');
                    if ($(this).hasClass('active')) return;
                    switchTab(screen);
                });

                window.switchTab = switchTab;

                /* ─── Init ─── */
                window.initI18n(function(locale) {
                    $('html').attr('lang', locale);
                    updateLangBtn(locale);
                    window.initConfig();
                    hideLoadingScreen();
                });

                $(document).on('click', '.lang-btn', function() {
                    var current = window.getLocale();
                    var next = current === 'es' ? 'en' : 'es';
                    window.setLocale(next).then(function() {
                        $('html').attr('lang', next);
                        updateLangBtn(next);
                    });
                });

                function updateLangBtn(locale) {
                    $('.lang-btn').text(locale === 'es' ? 'EN' : 'ES');
                }

                // Fallback por si initI18n tarda demasiado
                setTimeout(hideLoadingScreen, 3000);

            }); // fin bootWhenReady

        })();
    </script>

</body>
</html>
