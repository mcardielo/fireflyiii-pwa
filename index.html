<!DOCTYPE html>
<html lang="es" class="no-scroll">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title data-i18n="app.title_full">Registro de Transacciones PWA — Firefly III</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Firefly Ledger" data-i18n="apple.title">
    <meta name="format-detection" content="telephone=no">

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>
<body>

    <!-- Loading indicator: visible until app boots -->
    <div id="loading-screen" class="fixed inset-0 bg-ios-bg flex flex-col items-center justify-center z-[9999]">
        <div class="spinner spinner-lg"></div>
        <p class="mt-4 text-[15px] text-ios-text-secondary font-medium" data-i18n="loading.message">Cargando...</p>
    </div>

    <!-- Mount point: screens get injected here -->
    <div id="app"></div>

    <!-- ============================================================ -->
    <!-- SCREEN TEMPLATES -->
    <!-- ============================================================ -->

    <!-- ── Configuración (URL + Token) ── -->
    <template id="screen-setup">
        <div id="setup-container" class="screen screen-stack hidden">
            <div class="flex-1 overflow-y-auto px-4 pt-16 pb-4 ios-scroll relative">
                <div class="absolute top-4 right-4">
                    <button class="lang-btn text-sm font-semibold text-ios-blue">EN</button>
                </div>
                <div class="text-center mb-10">
                    <span data-icon="cog" class="w-16 h-16 bg-ios-blue-bg rounded-2xl flex items-center justify-center mx-auto mb-4"></span>
                    <h1 class="text-[28px] font-bold text-ios-text tracking-[-0.5px]" data-i18n="setup.title">Configuración</h1>
                    <p class="text-ios-text-secondary text-[15px] mt-2 max-w-xs mx-auto leading-5" data-i18n="setup.subtitle">
                        Conecta tu instancia de Firefly III con tu Token de Acceso Personal para empezar.
                    </p>
                </div>
                <form id="config-form">
                    <p class="section-label" data-i18n="setup.section_connection">Conexión</p>
                    <div class="field-card mb-6">
                        <div class="field-row">
                            <span class="field-label field-label--tight" data-i18n="setup.url_label">URL</span>
                            <div class="field-value">
                                <input type="url" id="firefly-url" required placeholder="https://miapp.firefly-iii.org"
                                       class="ios-input"
                                       data-i18n-placeholder="setup.url_placeholder">
                            </div>
                        </div>
                        <div class="field-row">
                            <span class="field-label field-label--tight" data-i18n="setup.token_label">Token</span>
                            <div class="field-value">
                                <input type="password" id="personal-token" required placeholder="xxxxxxxxxxxxxxxxxxxxxxx"
                                       class="ios-input"
                                       data-i18n-placeholder="setup.token_placeholder">
                            </div>
                        </div>
                    </div>
                    <div id="config-message" class="ios-status hidden"></div>
                </form>
            </div>
            <footer class="sticky-footer">
                <button type="submit" id="setup-submit-btn" class="ios-btn-primary" form="config-form">
                    <span data-i18n="setup.submit_btn">Conectar y Continuar</span>
                </button>
            </footer>
        </div>
    </template>

    <!-- ── Selección de Cuenta Default ── -->
    <template id="screen-account-picker">
        <div id="default-account-container" class="screen screen-stack hidden">
            <div class="flex-1 overflow-y-auto px-4 pt-16 pb-4 ios-scroll relative">
                <div class="absolute top-4 right-4">
                    <button class="lang-btn text-sm font-semibold text-ios-blue">EN</button>
                </div>
                <div class="text-center mb-10">
                    <span data-icon="creditCard" class="w-16 h-16 bg-ios-blue-bg rounded-2xl flex items-center justify-center mx-auto mb-4"></span>
                    <h1 class="text-[28px] font-bold text-ios-text tracking-[-0.5px]" data-i18n="account.title">Cuenta Default</h1>
                    <p class="text-ios-text-secondary text-[15px] mt-2 max-w-xs mx-auto leading-5" data-i18n="account.subtitle">
                        Selecciona la cuenta que se usará por defecto como origen al registrar tus transacciones.
                    </p>
                </div>
                <p class="section-label" data-i18n="account.section">Cuenta Origen</p>
                <div class="field-card mb-6">
                    <div class="field-row">
                        <span class="field-label field-label--tight" data-i18n="account.select_label">Cuenta</span>
                        <div class="field-value">
                            <select id="default-account-select" class="ios-select">
                                <option value="" data-i18n="account.loading">Cargando cuentas...</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div id="default-account-message" class="ios-status hidden"></div>

                <!-- ── Seguridad ── -->
                <p class="section-label" data-i18n="security.section">Seguridad</p>
                <div class="field-card mb-6">
                    <div class="field-row">
                        <span class="field-label field-label--tight" data-i18n="security.auth_label">Autenticación para cuentas</span>
                        <div class="field-value">
                            <label class="ios-switch">
                                <input type="checkbox" id="security-toggle-2">
                                <span class="ios-slider"></span>
                            </label>
                        </div>
                    </div>
                </div>
                <div id="security-config-area-2" class="hidden mb-6">
                    <div class="field-card mb-4">
                        <div class="field-row">
                            <span class="field-label field-label--tight" data-i18n="security.method">Usar biometría</span>
                            <div class="field-value">
                                <label class="ios-switch">
                                    <input type="checkbox" id="auth-biometric-2">
                                    <span class="ios-slider"></span>
                                </label>
                            </div>
                        </div>
                        <div id="pin-config-row-2" class="field-row hidden">
                            <span class="field-label field-label--tight" data-i18n="security.pin_label">PIN</span>
                            <div class="field-value">
                                <input type="password" id="auth-pin-2" placeholder="••••" maxlength="6"
                                       class="ios-input" style="width:80px; text-align:center; font-size:20px; letter-spacing:4px">
                            </div>
                        </div>
                    </div>
                    <p class="text-xs text-ios-text-secondary px-1" data-i18n="security.hint">
                        La biometría usa Face ID / huella del dispositivo.
                        Si no está disponible, puedes configurar un PIN.
                    </p>
                    <div id="security-message-2" class="ios-status hidden mt-4"></div>
                </div>

                <!-- ── Ubicación GPS ── -->
                <p class="section-label" data-i18n="config.gps_section">Ubicación</p>
                <div class="field-card mb-6">
                    <div class="field-row">
                        <span class="field-label field-label--tight" data-i18n="config.gps_label">Guardar ubicación GPS en transacciones</span>
                        <div class="field-value">
                            <label class="ios-switch">
                                <input type="checkbox" id="gps-toggle">
                                <span class="ios-slider"></span>
                            </label>
                        </div>
                    </div>
                </div>
                <p class="text-xs text-ios-text-secondary px-1 mb-6" data-i18n="config.gps_hint">Se usará tu ubicación actual al registrar nuevas transacciones o duplicar existentes.</p>
                <div id="gps-message" class="ios-status hidden"></div>

            </div>
            <footer class="sticky-footer">
                <button id="save-default-account-btn" class="ios-btn-primary">
                    <span data-i18n="account.save_btn">Guardar y Continuar</span>
                </button>
            </footer>
        </div>
    </template>

    <!-- ── Dashboard / Registro de Transacciones ── -->
    <template id="screen-record">
        <div id="dashboard-container" class="screen screen-stack hidden">
            <header class="nav-bar">
                <h1 class="text-[22px] font-bold text-ios-text tracking-[-0.5px]" data-i18n="app.title">Registro</h1>
                <div class="flex items-center gap-4">
                    <button class="theme-toggle" onclick="FFPWA.theme.cycle()" title="Cambiar tema"><span class="theme-icon" data-icon="moon"></span></button>
                    <button class="lang-btn text-sm font-semibold text-ios-blue">EN</button>
                    <span class="online-status text-xs font-semibold text-ios-green bg-ios-green-bg px-3 py-1 rounded-full">● Online</span>
                </div>
            </header>
            <main class="flex-1 overflow-y-auto px-4 pt-3 pb-4 ios-scroll">
                <div class="mb-6">
                    <p class="section-label" data-i18n="transaction.type">Tipo de Transacción</p>
                    <div class="segmented-control" role="radiogroup" id="type-selector">
                        <button type="button" role="radio" aria-checked="true" data-type="withdrawal" class="segmented-btn active"><span data-icon="banknoteArrowUp"></span> <span data-i18n="transaction.withdrawal">Gasto</span></button>
                        <button type="button" role="radio" aria-checked="false" data-type="deposit" class="segmented-btn"><span data-icon="banknoteArrowDown"></span> <span data-i18n="transaction.deposit">Depósito</span></button>
                        <button type="button" role="radio" aria-checked="false" data-type="transfer" class="segmented-btn"><span data-icon="arrowLeftRight"></span> <span data-i18n="transaction.transfer">Transferencia</span></button>
                    </div>
                    <input type="hidden" id="transaction-type" value="withdrawal">
                </div>
                <div id="status-message" class="ios-status hidden"></div>
                <form id="transaction-form">
                    <div class="mb-6 field-group">
                        <p class="section-label" data-i18n="transaction.source_section">Cuenta Origen</p>
                        <div class="field-card">
                            <div class="field-row">
                                <span class="field-label"><span data-i18n="transaction.source_label">Origen</span> <span id="source-type-hint" class="field-hint" data-i18n="transaction.source_hint_asset">(Asset)</span></span>
                                <div class="field-value">
                                    <div class="relative flex-1">
                                        <input type="text" id="source-account" placeholder="Selecciona..." autocomplete="off" class="ios-input" data-i18n-placeholder="transaction.source_placeholder">
                                        <div id="source-autocomplete" class="autocomplete-dropdown hidden"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <input type="hidden" id="source-account-id" name="source-account-id">
                        <input type="hidden" id="source-account-name" name="source-account-name">
                    </div>
                    <div class="mb-6 field-group">
                        <p class="section-label" data-i18n="transaction.dest_section">Cuenta Destino</p>
                        <div class="field-card">
                            <div class="field-row">
                                <span class="field-label"><span data-i18n="transaction.dest_label">Destino</span> <span id="dest-type-hint" class="field-hint" data-i18n="transaction.dest_hint_expense">(Expense)</span></span>
                                <div class="field-value">
                                    <div class="relative flex-1">
                                        <input type="text" id="destination-account" required placeholder="Buscar cuenta..." autocomplete="off" class="ios-input" data-i18n-placeholder="transaction.dest_placeholder">
                                        <div id="destination-autocomplete" class="autocomplete-dropdown hidden"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <input type="hidden" id="destination-account-id" name="destination-account-id">
                        <input type="hidden" id="destination-account-name" name="destination-account-name">
                    </div>
                    <div class="mb-6 field-group">
                        <p class="section-label" data-i18n="transaction.details_section">Detalles</p>
                        <div class="field-card">
                            <div class="field-row">
                                <span class="field-label" data-i18n="transaction.description_label">Concepto</span>
                                <div class="field-value">
                                    <input type="text" id="description" required placeholder="Ej: Compra en supermercado" class="ios-input" data-i18n-placeholder="transaction.description_placeholder">
                                </div>
                            </div>
                            <div class="field-row">
                                <span class="field-label" data-i18n="transaction.amount_label">Importe</span>
                                <div class="field-value">
                                    <input type="text" inputmode="decimal" step="0.01" min="0" id="amount" required placeholder="0.00" class="ios-input" data-i18n-placeholder="transaction.amount_placeholder">
                                    <button type="button" id="calc-btn" class="calc-trigger-btn" aria-label="Abrir calculadora"><span data-icon="calculator"></span></button>
                                    <span class="currency-wrap">
                                        <select id="currency-select" class="currency-badge"></select>
                                        <span class="currency-chevron">▼</span>
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div id="exchange-rate-info" class="hidden">
                            <p id="exchange-rate-display" class="text-xs text-ios-text-secondary"></p>
                            <p id="amount-converted" class="text-sm font-medium text-ios-blue hidden"></p>
                        </div>
                    </div>
                    <div id="tx-gps-row" class="mb-6 field-group hidden">
                        <p class="section-label" data-i18n="transaction.gps_section">Ubicación</p>
                        <div class="field-card">
                            <div class="field-row">
                                <span class="field-label field-label--tight" data-i18n="transaction.gps_label">Incluir ubicación GPS</span>
                                <div class="field-value">
                                    <label class="ios-switch">
                                        <input type="checkbox" id="tx-gps-toggle" checked>
                                        <span class="ios-slider"></span>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <p class="text-xs text-ios-text-secondary px-1 mt-1" data-i18n="transaction.gps_hint">Tu ubicación actual se guardará con esta transacción.</p>
                    </div>
                </form>
            </main>
            <footer class="sticky-footer">
                <button type="submit" id="submit-transaction-btn" class="ios-btn-primary" form="transaction-form">
                    <span data-i18n="transaction.submit_btn">Registrar Transacción</span>
                </button>
            </footer>
        </div>
    </template>

    <!-- ── Consultar Cuentas y Saldos ── -->
    <template id="screen-accounts">
        <div id="accounts-container" class="screen screen-stack hidden">
            <header class="nav-bar">
                <h1 class="text-[22px] font-bold text-ios-text tracking-[-0.5px]" data-i18n="accounts.title">Cuentas</h1>
                <div class="flex items-center gap-4">
                    <button class="theme-toggle" onclick="FFPWA.theme.cycle()" title="Cambiar tema"><span class="theme-icon" data-icon="moon"></span></button>
                    <button class="lang-btn text-sm font-semibold text-ios-blue">EN</button>
                    <span class="online-status text-xs font-semibold text-ios-green bg-ios-green-bg px-3 py-1 rounded-full">● Online</span>
                </div>
            </header>
            <main class="flex-1 overflow-y-auto px-4 pt-3 pb-4 ios-scroll">
                <!-- Accounts list view -->
                <div id="accounts-loading" class="text-center py-8">
                    <div class="spinner mx-auto mb-2"></div>
                    <p class="text-sm text-ios-text-secondary" data-i18n="accounts.loading">Cargando cuentas...</p>
                </div>
                <div id="accounts-error" class="ios-status error hidden"></div>
                <div id="accounts-list" class="space-y-3"></div>

                <!-- Transaction detail view (hidden by default) -->
                <div id="account-detail" class="hidden">
                    <!-- Back button + account name -->
                    <button id="detail-back-btn" class="text-sm font-semibold text-ios-blue mb-4">
                        <span data-i18n="detail.back">← Cuentas</span>
                    </button>

                    <!-- Account summary -->
                    <div class="field-card mb-6 p-4">
                        <h2 id="detail-account-name" class="text-[17px] font-semibold text-ios-text"></h2>
                        <p id="detail-account-balance" class="text-[22px] font-bold text-ios-text mt-1"></p>
                        <p id="detail-account-role" class="text-[12px] text-ios-text-secondary mt-0.5"></p>
                    </div>

                    <!-- Loading -->
                    <div id="detail-loading" class="text-center py-8 hidden">
                        <div class="spinner mx-auto mb-2"></div>
                        <p class="text-sm text-ios-text-secondary" data-i18n="detail.loading">Cargando transacciones...</p>
                    </div>

                    <!-- Error -->
                    <div id="detail-error" class="ios-status error hidden"></div>

                    <!-- Transaction list -->
                    <div id="detail-list"></div>

                    <!-- Load more button -->
                    <button id="detail-load-more" class="ios-btn-primary mt-4 hidden">
                        <span data-i18n="detail.load_more">Cargar 50 más</span>
                    </button>
                </div>
            </main>
        </div>
    </template>

    <!-- ── Historial de Transacciones ── -->
    <template id="screen-history">
        <div id="history-container" class="screen screen-stack hidden">
            <header class="nav-bar">
                <h1 class="text-[22px] font-bold text-ios-text tracking-[-0.5px]" data-i18n="nav.history">Historial</h1>
                <div class="flex items-center gap-4">
                    <button class="theme-toggle" onclick="FFPWA.theme.cycle()" title="Cambiar tema"><span class="theme-icon" data-icon="moon"></span></button>
                    <button class="lang-btn text-sm font-semibold text-ios-blue">EN</button>
                    <span class="online-status text-xs font-semibold text-ios-green bg-ios-green-bg px-3 py-1 rounded-full">● Online</span>
                </div>
            </header>
            <!-- Filter bar -->
            <div id="history-filters" class="px-4 pt-2 pb-1">
                <!-- Transaction type segmented control -->
                <div class="segmented-control mb-3" role="radiogroup" id="history-type-filter">
                    <button type="button" role="radio" aria-checked="true" data-type="" class="segmented-btn active"><span data-icon="listFilter"></span> <span data-i18n="history.filter_all">Todos</span></button>
                    <button type="button" role="radio" aria-checked="false" data-type="withdrawal" class="segmented-btn"><span data-icon="banknoteArrowUp"></span> <span data-i18n="transaction.withdrawal">Gasto</span></button>
                    <button type="button" role="radio" aria-checked="false" data-type="deposit" class="segmented-btn"><span data-icon="banknoteArrowDown"></span> <span data-i18n="transaction.deposit">Depósito</span></button>
                    <button type="button" role="radio" aria-checked="false" data-type="transfer" class="segmented-btn"><span data-icon="arrowLeftRight"></span> <span data-i18n="transaction.transfer">Transferencia</span></button>
                </div>
                <!-- Expense account filter -->
                <div class="field-card mb-2" id="history-account-filter-wrap">
                    <div class="field-row">
                        <span class="field-label"><span data-i18n="history.filter_account_label">Cuenta</span></span>
                        <div class="field-value">
                            <div class="relative flex-1">
                                <input type="text" id="history-account-filter" class="ios-input"
                                       data-i18n-placeholder="history.filter_account_placeholder"
                                       placeholder="Buscar cuenta..." autocomplete="off">
                                <ul id="history-account-dropdown" class="autocomplete-dropdown hidden"></ul>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Search by description -->
                <div class="field-card mb-2">
                    <div class="field-row">
                        <span class="field-label"><span data-i18n="history.filter_search_label">Buscar</span></span>
                        <div class="field-value">
                            <input type="text" id="history-search" class="ios-input flex-1"
                                   data-i18n-placeholder="history.filter_search_placeholder"
                                   placeholder="Descripción..." autocomplete="off">
                        </div>
                    </div>
                </div>
                <!-- Clear filters (right-aligned, hidden by default) -->
                <div id="history-clear-wrap" class="text-right hidden">
                    <button id="history-clear-filters" class="segmented-btn" style="color:var(--ios-red)">
                        <span data-icon="trash2"></span>
                        <span data-i18n="history.filter_clear">Limpiar filtros</span>
                    </button>
                </div>
            </div>
            <main class="flex-1 overflow-y-auto px-4 pt-3 pb-4 ios-scroll">
                <!-- List view -->
                <div id="history-list-view">
                    <div id="history-loading" class="text-center py-8">
                        <div class="spinner mx-auto mb-2"></div>
                        <p class="text-sm text-ios-text-secondary" data-i18n="history.loading">Cargando historial...</p>
                    </div>
                    <div id="history-error" class="ios-status error hidden"></div>
                    <div id="history-list"></div>
                    <div id="history-load-more-wrap" class="text-center mt-4">
                        <button id="history-load-more" class="ios-btn-primary hidden">
                            <span data-i18n="detail.load_more">Cargar 50 más</span>
                        </button>
                    </div>
                </div>

                <!-- Detail / Edit view -->
                <div id="history-detail" class="hidden">
                    <button id="history-detail-back" class="text-sm font-semibold text-ios-blue mb-4">
                        <span data-i18n="history.back">← Historial</span>
                    </button>

                    <!-- Transaction summary -->
                    <div id="history-detail-summary" class="field-card mb-4 p-4"></div>

                    <!-- Edit form -->
                    <form id="history-edit-form">
                        <p class="section-label mb-2" data-i18n="history.edit_title">Editar Transacción</p>
                        <div class="field-card mb-4">
                            <div class="field-row">
                                <span class="field-label" data-i18n="transaction.description_label">Concepto</span>
                                <div class="field-value">
                                    <input type="text" id="edit-description" required class="ios-input">
                                </div>
                            </div>
                        </div>

                        <p class="section-label mb-2" data-i18n="transaction.source_section">Cuenta Origen</p>
                        <div class="field-card mb-4">
                            <div class="field-row">
                                <span class="field-label" data-i18n="transaction.source_label">Origen</span>
                                <div class="field-value">
                                    <div class="relative flex-1">
                                        <input type="text" id="edit-source-account" required autocomplete="off" class="ios-input">
                                        <div id="edit-source-autocomplete" class="autocomplete-dropdown hidden"></div>
                                    </div>
                                </div>
                            </div>
                            <input type="hidden" id="edit-source-account-id">
                            <input type="hidden" id="edit-source-account-name">
                        </div>

                        <p class="section-label mb-2" data-i18n="transaction.dest_section">Cuenta Destino</p>
                        <div class="field-card mb-4">
                            <div class="field-row">
                                <span class="field-label" data-i18n="transaction.dest_label">Destino</span>
                                <div class="field-value">
                                    <div class="relative flex-1">
                                        <input type="text" id="edit-dest-account" required autocomplete="off" class="ios-input">
                                        <div id="edit-dest-autocomplete" class="autocomplete-dropdown hidden"></div>
                                    </div>
                                </div>
                            </div>
                            <input type="hidden" id="edit-dest-account-id">
                            <input type="hidden" id="edit-dest-account-name">
                        </div>

                        <p class="section-label mb-2" data-i18n="transaction.details_section">Detalles</p>
                        <div class="field-card mb-4">
                            <div class="field-row">
                                <span class="field-label"><span data-i18n="history.date">Fecha</span></span>
                                <div class="field-value">
                                    <input type="date" id="edit-date" class="ios-input" style="text-align:right;width:auto;">
                                </div>
                            </div>
                            <div class="field-row">
                                <span class="field-label"><span data-i18n="history.time">Hora</span></span>
                                <div class="field-value">
                                    <input type="time" id="edit-time" class="ios-input" style="text-align:right;width:auto;">
                                </div>
                            </div>
                            <div class="field-row">
                                <span class="field-label" data-i18n="transaction.amount_label">Importe</span>
                                <div class="field-value" style="gap:8px;">
                                    <input type="number" step="0.01" min="0" id="edit-amount" required class="ios-input" style="text-align:right;">
                                    <span id="edit-currency-code" class="text-[13px] font-medium text-ios-text-secondary flex-shrink-0"></span>
                                </div>
                            </div>
                            <div class="field-row" id="edit-foreign-row">
                                <span class="field-label" data-i18n="history.foreign_amount">Importe Extranjero</span>
                                <div class="field-value" style="gap:4px;">
                                    <input type="number" step="0.01" min="0" id="edit-foreign-amount" class="ios-input" style="text-align:right;">
                                    <input type="text" id="edit-foreign-currency" placeholder="USD" class="ios-input" style="text-align:right;width:60px;" maxlength="3">
                                </div>
                            </div>
                            <div class="field-row">
                                <span class="field-label" data-i18n="history.budget">Presupuesto</span>
                                <div class="field-value">
                                    <div class="ios-input">
                                        <select id="edit-budget" class="ios-select" style="direction:rtl;">
                                            <option value="">—</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="field-row">
                                <span class="field-label" data-i18n="history.category">Categoría</span>
                                <div class="field-value">
                                    <div class="ios-input">
                                        <input type="text" id="edit-category" class="ios-input" placeholder="—" autocomplete="off">
                                        <div id="edit-category-autocomplete" class="autocomplete-dropdown hidden"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div id="edit-status-message" class="ios-status hidden"></div>

                        <div class="sticky-footer" style="padding-left:0;padding-right:0;">
                            <button type="submit" id="history-save-btn" class="ios-btn-primary">
                                <span data-i18n="history.save">Guardar Cambios</span>
                            </button>
                            <button type="button" id="history-duplicate-btn" class="segmented-btn mt-3 hidden" style="color:var(--ios-blue);gap:4px;">
                                <span data-icon="copy"></span>
                                <span data-i18n="history.duplicate_btn">Duplicar</span>
                            </button>
                            <button type="button" id="history-delete-btn" class="segmented-btn mt-3 hidden" style="color:var(--ios-red);gap:4px;">
                                <span data-icon="trash2"></span>
                                <span data-i18n="history.delete_btn">Eliminar</span>
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </template>

    <!-- ── Lock Screen (overlay for accounts security) ── -->
    <template id="screen-lock">
        <div id="lock-container" class="fixed inset-0 z-[100] flex flex-col items-center justify-center"
             style="background: var(--ios-bg);">
            <div class="text-center px-8">
                <div class="text-center text-[48px] mb-6"><span data-icon="lock"></span></div>
                <h2 class="text-[22px] font-bold text-ios-text mb-2" data-i18n="lock.title">Cuentas Bloqueadas</h2>
                <p class="text-[15px] text-ios-text-secondary mb-8" data-i18n="lock.subtitle">Verifica tu identidad para acceder</p>

                <button id="lock-unlock-btn" class="ios-btn-primary mb-4">
                    <span id="lock-btn-text" data-i18n="lock.unlock_biometric">Desbloquear con biometría</span>
                </button>

                <div id="lock-pin-area" class="hidden">
                    <p class="text-sm text-ios-text-secondary mb-3" data-i18n="lock.pin_label">O ingresa tu PIN</p>
                    <input type="password" id="lock-pin-input" placeholder="••••" maxlength="6"
                           class="ios-input text-center text-[20px] tracking-[4px] mx-auto"
                           style="width:140px; border-bottom:2px solid var(--ios-separator); border-radius:0;">
                    <p id="lock-pin-error" class="text-xs text-ios-red mt-2 hidden" data-i18n="lock.pin_error">PIN incorrecto</p>
                </div>

                <div id="lock-loading" class="hidden">
                    <div class="spinner mx-auto mb-2"></div>
                    <p class="text-sm text-ios-text-secondary" data-i18n="lock.verifying">Verificando...</p>
                </div>

                <button id="lock-cancel-btn" class="ios-btn-secondary mt-8" data-i18n="lock.cancel">Cancelar</button>
            </div>
        </div>
    </template>

    <!-- Calculadora Modal -->
    <template id="calc-modal-template">
        <div id="calc-modal" class="calc-modal-overlay hidden">
            <div class="calc-modal-card">
                <div class="calc-display">
                    <div id="calc-expression" class="calc-expression"></div>
                    <div id="calc-result" class="calc-result">0</div>
                </div>
                <div class="calc-keypad">
                    <button class="calc-key calc-key-fn" data-action="clear">C</button>
                    <button class="calc-key calc-key-fn" data-action="backspace">⌫</button>
                    <button class="calc-key calc-key-fn" data-action="percent">%</button>
                    <button class="calc-key calc-key-op" data-action="operator" data-value="/">÷</button>
                    <button class="calc-key calc-key-num" data-action="digit" data-value="7">7</button>
                    <button class="calc-key calc-key-num" data-action="digit" data-value="8">8</button>
                    <button class="calc-key calc-key-num" data-action="digit" data-value="9">9</button>
                    <button class="calc-key calc-key-op" data-action="operator" data-value="*">×</button>
                    <button class="calc-key calc-key-num" data-action="digit" data-value="4">4</button>
                    <button class="calc-key calc-key-num" data-action="digit" data-value="5">5</button>
                    <button class="calc-key calc-key-num" data-action="digit" data-value="6">6</button>
                    <button class="calc-key calc-key-op" data-action="operator" data-value="-">−</button>
                    <button class="calc-key calc-key-num" data-action="digit" data-value="1">1</button>
                    <button class="calc-key calc-key-num" data-action="digit" data-value="2">2</button>
                    <button class="calc-key calc-key-num" data-action="digit" data-value="3">3</button>
                    <button class="calc-key calc-key-op" data-action="operator" data-value="+">+</button>
                    <button class="calc-key calc-key-num" data-action="digit" data-value="0">0</button>
                    <button class="calc-key calc-key-num" data-action="decimal">.</button>
                    <button class="calc-key calc-key-eq" data-action="equals">=</button>
                </div>
                <div class="calc-actions">
                    <button id="calc-cancel-btn" class="ios-btn-secondary flex-1" data-i18n="calc.cancel">Cancelar</button>
                    <button id="calc-use-btn" class="ios-btn-primary flex-1" data-i18n="calc.use_result">Usar resultado</button>
                </div>
            </div>
        </div>
    </template>

    <!-- Scripts -->
    <script src="js/http.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/darkmode.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/accounts.js"></script>
    <script src="js/currencies.js"></script>
    <script src="js/transactions-history.js"></script>
    <script src="js/transaction-edit.js"></script>
    <script src="js/transactions.js"></script>
    <script src="js/accounts-screen.js"></script>
    <script src="js/calculator.js"></script>
    <script src="js/app.js"></script>


</body>
